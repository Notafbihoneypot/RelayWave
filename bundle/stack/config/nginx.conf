worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;

  # RAM-only request limiting; no request log is written.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;

  proxy_cache_path /var/cache/nginx/opencast levels=1:2 keys_zone=blossom_cache:16m max_size=4g inactive=7d use_temp_path=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      limit_conn per_ip 20;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Deliberately do not forward X-Forwarded-For in the LAN test stack.
      proxy_pass http://opencast-app:8787;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://opencast-app:8787;
    }
  }

  # Local "edge" in front of Blossom. GET/HEAD content is cached; writes pass through.
  server {
    listen 8081;
    client_max_body_size 512m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /upload {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_set_header Host $http_host;
      proxy_pass http://opencast-blossom:3000;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_cache blossom_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 365d;
      proxy_cache_lock on;
      proxy_force_ranges on;
      add_header X-OpenCast-Cache $upstream_cache_status always;
      proxy_pass http://opencast-blossom:3000;
    }
  }
}
